<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJR Delights - Favorites</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#FFE5B4;
display:flex;
justify-content:center;
}

.phone{
width:390px;
min-height:844px;
background:#FFF7F2;
padding-bottom:90px;
}

.header{
background:#F28C6A;
padding:20px;
border-radius:0 0 30px 30px;
color:white;
text-align:center;
}

.header h2{
margin-top:10px;
}

.section{
padding:20px;
}

.card{
background:white;
border-radius:20px;
padding:15px;
margin-bottom:20px;
display:flex;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.image{
width:90px;
height:90px;
background:#FFE6D8;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
margin-right:15px;
}

.info{
flex:1;
}

.info h3{
color:#444;
margin-bottom:8px;
}

.price{
color:#F28C6A;
font-weight:bold;
margin:8px 0;
}

button{
background:#F28C6A;
color:white;
border:none;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
}

.heart{
font-size:22px;
color:#e63946;
float:right;
cursor:pointer;
user-select:none;
}

.empty-state{
text-align:center;
padding:60px 20px;
color:#999;
}

.empty-state .emoji{
font-size:50px;
margin-bottom:15px;
}

.empty-state p{
font-size:14px;
line-height:1.5;
}

.empty-state a{
display:inline-block;
margin-top:18px;
background:#F28C6A;
color:white;
text-decoration:none;
padding:12px 24px;
border-radius:20px;
font-weight:bold;
font-size:13px;
}

.bottom{
position:fixed;
bottom:0;
width:390px;
background:white;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #ddd;
}

.bottom a{
text-decoration:none;
color:#666;
font-size:13px;
text-align:center;
}

.bottom a:nth-child(3){
color:#F28C6A;
font-weight:bold;
}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<h2>❤️ My Favorites</h2>

<p>Your favorite desserts</p>

</div>

<div class="section" id="favorites-section">
<!-- filled in by script.js / renderFavoritePage() -->
</div>

<div class="bottom">

<a href="homeDJR.html">
🏠<br>Home
</a>

<a href="categoriesDJR.html">
📂<br>Categories
</a>

<a href="favoriteDJR.html">
❤️<br>Favorites
</a>

<a href="orderDJR.html">
🛒<br>Orders
</a>

<a href="accountDJR.html">
👤<br>Account
</a>

</div>

</div>

<script src="script.js"></script>
<script>
const FAV_DESCRIPTIONS = {
  'cupcake-choco':    'Rich chocolate cupcake with creamy frosting.',
  'cake-strawberry':  'Fresh strawberry sponge cake.',
  'cookie-box':       'Assorted homemade cookies.',
  'cookie-chocochip': 'Classic chocolate chip cookies.',
  'cookie-oatmeal':   'Chewy oatmeal cookies.',
  'drink-milktea':    'Creamy iced milk tea.',
  'drink-icedcoffee': 'Cold brewed iced coffee.',
  'cake-ube':         'Soft ube-flavored celebration cake.',
  'cake-chocolate':   'Moist chocolate layer cake.',
};

function renderFavoritePage() {
  const section = document.getElementById('favorites-section');
  const favs = getFavorites();

  if (favs.length === 0) {
    section.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🤍</div>
        <p>No favorites yet.<br>Tap the heart icon on any item to save it here.</p>
        <a href="homeDJR.html">Browse Menu</a>
      </div>`;
    return;
  }

  section.innerHTML = favs.map(id => {
    const p = DJR_PRODUCTS[id];
    if (!p) return '';
    return `
      <div class="card">
        <div class="image">${p.emoji}</div>
        <div class="info">
          <span class="heart" onclick="toggleFavorite('${id}')">❤</span>
          <h3>${p.name}</h3>
          <p>${FAV_DESCRIPTIONS[id] || ''}</p>
          <div class="price">₱${p.price}</div>
          <button onclick="addToCart('${id}')">Add to Cart</button>
        </div>
      </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', renderFavoritePage);
</script>
</body>
</html>
