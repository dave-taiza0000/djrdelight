<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJR Delights - Payment Method</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#FFE5B4;
display:flex;
justify-content:center;
}

.phone{
width:390px;
min-height:844px;
background:#FFF7F2;
padding-bottom:40px;
}

.header{
background:#F28C6A;
padding:25px 20px;
border-radius:0 0 30px 30px;
color:white;
display:flex;
align-items:center;
gap:14px;
}

.back-link{
color:white;
text-decoration:none;
font-size:22px;
line-height:1;
}

.header h2{
font-size:19px;
}

.section{
padding:20px;
}

h3.label{
color:#F28C6A;
font-size:13px;
text-transform:uppercase;
letter-spacing:.5px;
margin:0 0 10px;
}

.method-card{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
border-radius:15px;
padding:14px 16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.method-info{
display:flex;
align-items:center;
gap:12px;
}

.method-emoji{
font-size:22px;
}

.method-info div span{
display:block;
}

.method-label{
font-size:14px;
color:#444;
font-weight:bold;
}

.method-sub{
font-size:11.5px;
color:#999;
margin-top:2px;
}

.default-badge{
display:inline-block;
background:#FFF0E8;
color:#F28C6A;
font-size:10px;
font-weight:bold;
padding:3px 8px;
border-radius:10px;
margin-top:4px;
}

.method-actions{
display:flex;
gap:10px;
align-items:center;
}

.set-default-btn{
background:none;
border:1px solid #F28C6A;
color:#F28C6A;
font-size:11px;
font-weight:bold;
padding:6px 10px;
border-radius:14px;
cursor:pointer;
}

.remove-btn{
background:none;
border:none;
color:#bbb;
font-size:18px;
cursor:pointer;
line-height:1;
}

.remove-btn:hover{
color:#e63946;
}

.empty-note{
text-align:center;
color:#999;
font-size:13px;
padding:15px 0 25px;
}

.add-form{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-top:10px;
}

.add-form label{
display:block;
color:#555;
margin-bottom:5px;
font-size:13.5px;
}

.add-form select,
.add-form input{
width:100%;
padding:11px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:14px;
outline:none;
font-size:13.5px;
font-family:Arial,sans-serif;
}

.add-form select:focus,
.add-form input:focus{
border-color:#F28C6A;
}

.add-btn{
display:block;
width:100%;
background:#F28C6A;
color:white;
border:none;
padding:14px;
border-radius:25px;
font-weight:bold;
font-size:14.5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="phone">

<div class="header">
<a href="accountDJR.html" class="back-link">←</a>
<h2>Payment Method</h2>
</div>

<div class="section">

<h3 class="label">Saved Methods</h3>
<div id="method-list"></div>

<h3 class="label" style="margin-top:18px;">Add New Method</h3>
<div class="add-form">

<label>Type</label>
<select id="pm-type" onchange="togglePmFields()">
<option value="Cash on Delivery">💵 Cash on Delivery</option>
<option value="GCash">📱 GCash</option>
<option value="Card">💳 Credit / Debit Card</option>
</select>

<div id="pm-gcash-fields">
<label>GCash Mobile Number</label>
<input type="tel" id="pm-gcash-number" placeholder="09XX XXX XXXX">
</div>

<div id="pm-card-fields" style="display:none;">
<label>Cardholder Name</label>
<input type="text" id="pm-card-name" placeholder="Juan Dela Cruz">
<label>Card Number</label>
<input type="text" id="pm-card-number" placeholder="•••• •••• •••• 1234" maxlength="19">
</div>

<button class="add-btn" onclick="addMethod()">+ Add Method</button>

</div>

</div>

</div>

<script src="script.js"></script>
<script>
function togglePmFields() {
  const type = document.getElementById('pm-type').value;
  document.getElementById('pm-gcash-fields').style.display = type === 'GCash' ? 'block' : 'none';
  document.getElementById('pm-card-fields').style.display = type === 'Card' ? 'block' : 'none';
}

function methodEmoji(type) {
  if (type === 'GCash') return '📱';
  if (type === 'Card') return '💳';
  return '💵';
}

function renderMethods() {
  const list = getPaymentMethods();
  const container = document.getElementById('method-list');

  if (list.length === 0) {
    container.innerHTML = '<p class="empty-note">No saved payment methods yet. Add one below — Cash on Delivery always works too.</p>';
    return;
  }

  container.innerHTML = list.map(m => `
    <div class="method-card">
      <div class="method-info">
        <span class="method-emoji">${methodEmoji(m.type)}</span>
        <div>
          <span class="method-label">${m.label}</span>
          <span class="method-sub">${m.sub || m.type}</span>
          ${m.isDefault ? '<span class="default-badge">DEFAULT</span>' : ''}
        </div>
      </div>
      <div class="method-actions">
        ${m.isDefault ? '' : `<button class="set-default-btn" onclick="makeDefault('${m.id}')">Set default</button>`}
        <button class="remove-btn" onclick="deleteMethod('${m.id}')" title="Remove">✕</button>
      </div>
    </div>`).join('');
}

function addMethod() {
  const type = document.getElementById('pm-type').value;
  let label, sub;

  if (type === 'GCash') {
    const number = document.getElementById('pm-gcash-number').value.trim();
    if (!number) { alert('Please enter your GCash mobile number.'); return; }
    label = 'GCash';
    sub = number;
    document.getElementById('pm-gcash-number').value = '';
  } else if (type === 'Card') {
    const name = document.getElementById('pm-card-name').value.trim();
    const number = document.getElementById('pm-card-number').value.trim();
    if (!name || !number) { alert('Please fill in the card details.'); return; }
    const last4 = number.replace(/\s/g, '').slice(-4);
    label = name;
    sub = '•••• ' + last4;
    document.getElementById('pm-card-name').value = '';
    document.getElementById('pm-card-number').value = '';
  } else {
    label = 'Cash on Delivery';
    sub = 'Pay when your order arrives';
  }

  addPaymentMethod({ type, label, sub });
  renderMethods();
  toast('Payment method added');
}

function makeDefault(id) {
  setDefaultPaymentMethod(id);
  renderMethods();
}

function deleteMethod(id) {
  removePaymentMethod(id);
  renderMethods();
}

document.addEventListener('DOMContentLoaded', renderMethods);
</script>

</body>
</html>
