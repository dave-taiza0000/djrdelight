<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJR Delights - Orders</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#FFE5B4;
display:flex;
justify-content:center;
}

.phone{
width:390px;
min-height:844px;
background:#FFF7F2;
padding-bottom:100px;
}

.header{
background:#F28C6A;
padding:25px;
border-radius:0 0 30px 30px;
color:white;
text-align:center;
}

.header h2{
margin-bottom:5px;
}

.section{
padding:20px;
}

.order-card{
background:white;
border-radius:20px;
padding:15px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
display:flex;
}

.image{
width:90px;
height:90px;
background:#FFE6D8;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
margin-right:15px;
}

.info{
flex:1;
}

.info h3{
color:#444;
margin-bottom:8px;
}

.price{
color:#F28C6A;
font-weight:bold;
margin:8px 0;
}

.status{
display:inline-block;
padding:5px 12px;
border-radius:15px;
background:#DFF5E1;
color:green;
font-size:12px;
margin-top:8px;
}

.item-top-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.remove-btn{
background:none;
border:none;
color:#bbb;
font-size:18px;
cursor:pointer;
line-height:1;
padding:0 0 0 10px;
}

.remove-btn:hover{
color:#e63946;
}

.qty-controls{
display:flex;
align-items:center;
gap:12px;
margin-top:8px;
}

.qty-controls button{
width:26px;
height:26px;
border-radius:50%;
border:1px solid #ddd;
background:white;
color:#F28C6A;
font-size:15px;
cursor:pointer;
line-height:1;
}

.qty-controls span{
font-weight:bold;
color:#444;
min-width:14px;
text-align:center;
}

.empty-state{
text-align:center;
padding:60px 20px;
color:#999;
}

.empty-state .emoji{
font-size:50px;
margin-bottom:15px;
}

.empty-state p{
font-size:14px;
line-height:1.5;
}

.empty-state a{
display:inline-block;
margin-top:18px;
background:#F28C6A;
color:white;
text-decoration:none;
padding:12px 24px;
border-radius:20px;
font-weight:bold;
font-size:13px;
}

.summary{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.row{
display:flex;
justify-content:space-between;
margin:12px 0;
}

.total{
font-size:18px;
font-weight:bold;
color:#F28C6A;
}

.checkout{
display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
background:#F28C6A;
color:white;
padding:15px;
border-radius:25px;
font-weight:bold;
}

.bottom{
position:fixed;
bottom:0;
width:390px;
background:white;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #ddd;
}

.bottom a{
text-decoration:none;
color:#666;
font-size:13px;
text-align:center;
}

.bottom a:nth-child(4){
color:#F28C6A;
font-weight:bold;
}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<h2>🛒 Your Cart</h2>

<p>Review before checking out</p>

<a href="orderHistory.html" style="display:inline-block; margin-top:8px; color:white; font-size:12px; text-decoration:underline;">View past orders →</a>

</div>

<div class="section" id="order-section">
<!-- filled in by renderOrderPage() -->
</div>

<div class="bottom">

<a href="homeDJR.html">
🏠<br>Home
</a>

<a href="categoriesDJR.html">
📂<br>Categories
</a>

<a href="favoriteDJR.html">
❤️<br>Favorites
</a>

<a href="orderDJR.html">
🛒<br>Orders
</a>

<a href="accountDJR.html">
👤<br>Account
</a>

</div>

</div>

<script src="script.js"></script>
<script>
function renderOrderPage() {
  const section = document.getElementById('order-section');
  const cart = getCart();
  const ids = Object.keys(cart).filter(id => DJR_PRODUCTS[id]);

  if (ids.length === 0) {
    section.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🛒</div>
        <p>Your cart is empty.<br>Browse our menu to add some treats!</p>
        <a href="homeDJR.html">Browse Menu</a>
      </div>`;
    return;
  }

  const itemsHtml = ids.map(id => {
    const p = DJR_PRODUCTS[id];
    const qty = cart[id];
    return `
      <div class="order-card">
        <div class="image">${p.emoji}</div>
        <div class="info">
          <div class="item-top-row">
            <h3>${p.name}</h3>
            <button class="remove-btn" onclick="removeFromCart('${id}')" title="Remove">✕</button>
          </div>
          <div class="price">₱${p.price * qty}</div>
          <div class="qty-controls">
            <button onclick="changeCartQty('${id}', -1)">−</button>
            <span>${qty}</span>
            <button onclick="changeCartQty('${id}', 1)">+</button>
          </div>
        </div>
      </div>`;
  }).join('');

  const subtotal = cartSubtotal();
  const total = subtotal + DELIVERY_FEE;

  section.innerHTML = itemsHtml + `
    <div class="summary">
      <h3>Order Summary</h3>
      <div class="row"><span>Subtotal</span><span>₱${subtotal}</span></div>
      <div class="row"><span>Delivery Fee</span><span>₱${DELIVERY_FEE}</span></div>
      <hr>
      <div class="row total"><span>Total</span><span>₱${total}</span></div>
      <a href="checkout.html" class="checkout">Proceed to Checkout</a>
    </div>`;
}

document.addEventListener('DOMContentLoaded', renderOrderPage);
</script>
</body>
</html>
