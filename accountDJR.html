<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJR Delights - Account</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#FFE5B4;
display:flex;
justify-content:center;
}

.phone{
width:390px;
min-height:844px;
background:#FFF7F2;
padding-bottom:100px;
}

.header{
background:#F28C6A;
padding:35px 20px;
border-radius:0 0 30px 30px;
text-align:center;
color:white;
}

.profile{
width:110px;
height:110px;
background:white;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:60px;
color:#F28C6A;
}

.header h2{
margin-top:15px;
}

.header p{
margin-top:5px;
font-size:14px;
}

.section{
padding:20px;
}

.menu{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.menu span{
font-size:16px;
color:#444;
}

.arrow{
color:#999;
}

.feedback{
display:block;
text-align:center;
background:white;
color:#F28C6A;
border:2px solid #F28C6A;
text-decoration:none;
padding:13px;
border-radius:25px;
font-weight:bold;
margin:25px 20px 0;
}

.logout{
display:block;
text-align:center;
background:#F28C6A;
color:white;
text-decoration:none;
padding:15px;
border-radius:25px;
font-weight:bold;
margin:15px 20px 30px;
}

.bottom{
position:fixed;
bottom:0;
width:390px;
background:white;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #ddd;
}

.bottom a{
text-decoration:none;
color:#666;
font-size:13px;
text-align:center;
}

.bottom a:nth-child(5){
color:#F28C6A;
font-weight:bold;
}

</style>

</head>

<body>

<div class="phone">

<div class="header">

<div class="profile">
👤
</div>

<h2 id="profile-name">Guest</h2>

<p id="profile-email">Log in to see your account</p>

</div>

<div class="section">

<a href="editProfile.html" class="menu" style="text-decoration:none;">
<span>👤 Edit Profile</span>
<span class="arrow">></span>
</a>

<a href="orderHistory.html" class="menu" style="text-decoration:none;">
<span>📦 My Orders</span>
<span class="arrow">></span>
</a>

<a href="favoriteDJR.html" class="menu" style="text-decoration:none;">
<span>❤️ Favorites</span>
<span class="arrow">></span>
</a>

<a href="deliveryAddress.html" class="menu" style="text-decoration:none;">
<span>🏠 Delivery Address</span>
<span class="arrow">></span>
</a>

<a href="paymentMethod.html" class="menu" style="text-decoration:none;">
<span>💳 Payment Method</span>
<span class="arrow">></span>
</a>

<a href="settings.html" class="menu" style="text-decoration:none;">
<span>⚙ Settings</span>
<span class="arrow">></span>
</a>

<a href="helpCenter.html" class="menu" style="text-decoration:none;">
<span>❓ Help Center</span>
<span class="arrow">></span>
</a>

</div>

<a href="https://forms.gle/q4Hat5EvqzR6xZnY7" target="_blank" class="feedback">
💬 Send Us Feedback
</a>

<a href="index.html" class="logout" onclick="clearCurrentUser()">
Log Out
</a>

<div class="bottom">

<a href="homeDJR.html">
🏠<br>Home
</a>

<a href="categoriesDJR.html">
📂<br>Categories
</a>

<a href="favoriteDJR.html">
❤️<br>Favorites
</a>

<a href="orderDJR.html">
🛒<br>Orders
</a>

<a href="accountDJR.html">
👤<br>Account
</a>

</div>

</div>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = getCurrentUser();
  if (user) {
    document.getElementById('profile-name').textContent = user.name;
    document.getElementById('profile-email').textContent = user.email;
  }
});
</script>
</body>
</html>
